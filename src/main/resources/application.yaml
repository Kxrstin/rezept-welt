spring:
  datasource:
    password: ${DB_PASS}
    username: ${DB_USER}
    url: jdbc:postgresql://database:5432/KxrstinDatenbank

  flyway:
    locations:
      - classpath:db/migration
    ignore-migration-patterns:
      - *:missing

  servlet:
    multipart:
      max-request-size: 5MB
      max-file-size: 5MB