name: Local CI/CD Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file from Secrets
        run: |
          echo "DB_USER=${{ secrets.DB_USER }}" > .env
          echo "DB_PASS=${{ secrets.DB_PASS }}" >> .env
          echo "DB_NAME=KxrstinDatenbank" >> .env
        shell: bash

      - name: Start Database and App via Docker Compose
        run: |
          docker compose down
          docker compose up -d --build