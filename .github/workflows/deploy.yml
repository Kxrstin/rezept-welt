name: Local CI/CD Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Database and App via Docker Compose
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          # Stoppt alte Container, baut die App neu und startet alles im Hintergrund
          docker compose down
          docker compose up -d --build